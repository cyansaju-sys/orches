[project]
name = "orches"
version = "0.1.3"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.3",
    "keyring>=25.7.0",
    "oracledb>=26.0.1",
    "pyte>=0.8.2",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "flet-web>=1.0.3",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.3",
    "poethepoet>=0.48.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "orches"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

# La plantilla de Flet 1.0.3 fija jni 1.0.0, pero jni_flutter (más nuevo) exige jni ^1.1.0 y la compilación falla.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"

[tool.poe.tasks]
dev="flet run"
test="pytest"
